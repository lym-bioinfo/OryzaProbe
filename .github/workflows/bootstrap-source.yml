name: Import source archive

on:
  push:
    paths:
      - OryzaProbe-source.zip

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source tree
        run: |
          unzip -o OryzaProbe-source.zip
          rm OryzaProbe-source.zip
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import OryzaProbe 0.2.0 source"
          git push
